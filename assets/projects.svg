<svg xmlns="http://www.w3.org/2000/svg" width="860" height="320" viewBox="0 0 860 320" role="img" aria-label="Selected projects: Push My Tabs, Let Him Grill, Penguin Patches"><rect x="1.5" y="1.5" width="857" height="317" rx="16" fill="#131119" stroke="#9e75d6" stroke-width="2"/><rect x="12" y="16" width="268" height="288" rx="8" fill="#1c1528" stroke="#624b7d"/><text x="32" y="56" fill="#a79bb7" font-family="Arial, sans-serif" font-size="12" text-anchor="start" font-weight="400">PROJECT / 01</text><text x="32" y="101" fill="#bd93f9" font-family="Arial, sans-serif" font-size="25" text-anchor="start" font-weight="700">Push My Tabs</text><text x="32" y="146" fill="#c8c0d5" font-family="Arial, sans-serif" font-size="19" text-anchor="start" font-weight="400">Layout-aware keyboard</text><text x="32" y="175" fill="#c8c0d5" font-family="Arial, sans-serif" font-size="19" text-anchor="start" font-weight="400">shortcuts for Chrome and</text><text x="32" y="204" fill="#c8c0d5" font-family="Arial, sans-serif" font-size="19" text-anchor="start" font-weight="400">Firefox. Switch and move</text><text x="32" y="233" fill="#c8c0d5" font-family="Arial, sans-serif" font-size="19" text-anchor="start" font-weight="400">tabs in the direction</text><text x="32" y="262" fill="#c8c0d5" font-family="Arial, sans-serif" font-size="19" text-anchor="start" font-weight="400">they appear.</text><rect x="296" y="16" width="268" height="288" rx="8" fill="#1c1528" stroke="#624b7d"/><text x="316" y="56" fill="#a79bb7" font-family="Arial, sans-serif" font-size="12" text-anchor="start" font-weight="400">PROJECT / 02</text><text x="316" y="101" fill="#bd93f9" font-family="Arial, sans-serif" font-size="25" text-anchor="start" font-weight="700">Let Him Grill</text><text x="316" y="146" fill="#c8c0d5" font-family="Arial, sans-serif" font-size="19" text-anchor="start" font-weight="400">A planning skill for</text><text x="316" y="175" fill="#c8c0d5" font-family="Arial, sans-serif" font-size="19" text-anchor="start" font-weight="400">Codex. Resolve</text><text x="316" y="204" fill="#c8c0d5" font-family="Arial, sans-serif" font-size="19" text-anchor="start" font-weight="400">reversible decisions and</text><text x="316" y="233" fill="#c8c0d5" font-family="Arial, sans-serif" font-size="19" text-anchor="start" font-weight="400">keep human judgment at</text><text x="316" y="262" fill="#c8c0d5" font-family="Arial, sans-serif" font-size="19" text-anchor="start" font-weight="400">meaningful gates.</text><rect x="580" y="16" width="268" height="288" rx="8" fill="#1c1528" stroke="#624b7d"/><text x="600" y="56" fill="#a79bb7" font-family="Arial, sans-serif" font-size="12" text-anchor="start" font-weight="400">PROJECT / 03</text><text x="600" y="101" fill="#bd93f9" font-family="Arial, sans-serif" font-size="25" text-anchor="start" font-weight="700">Penguin Patches</text><text x="600" y="146" fill="#c8c0d5" font-family="Arial, sans-serif" font-size="19" text-anchor="start" font-weight="400">Focused Fossify Android</text><text x="600" y="175" fill="#c8c0d5" font-family="Arial, sans-serif" font-size="19" text-anchor="start" font-weight="400">app fixes compatible</text><text x="600" y="204" fill="#c8c0d5" font-family="Arial, sans-serif" font-size="19" text-anchor="start" font-weight="400">with Morphe. Pre-</text><text x="600" y="233" fill="#c8c0d5" font-family="Arial, sans-serif" font-size="19" text-anchor="start" font-weight="400">release; see the</text><text x="600" y="262" fill="#c8c0d5" font-family="Arial, sans-serif" font-size="19" text-anchor="start" font-weight="400">repository for scope.</text></svg>