<svg xmlns="http://www.w3.org/2000/svg" width="860" height="1080" viewBox="0 0 860 1080" role="img" aria-label="Selected projects: Push My Tabs, Let Him Grill, Penguin Patches"><rect x="1.5" y="1.5" width="857" height="1077" rx="16" fill="#faf7ff" stroke="#ad8ac8" stroke-width="2"/><rect x="22" y="18" width="816" height="330" rx="8" fill="#f1e9fa" stroke="#cbb5df"/><text x="42" y="58" fill="#62516e" font-family="Arial, sans-serif" font-size="22" text-anchor="start" font-weight="400">PROJECT / 01</text><text x="42" y="113" fill="#6f3ca3" font-family="Arial, sans-serif" font-size="42" text-anchor="start" font-weight="700">Push My Tabs</text><text x="42" y="173" fill="#4e405e" font-family="Arial, sans-serif" font-size="32" text-anchor="start" font-weight="400">Layout-aware keyboard shortcuts for Chrome</text><text x="42" y="217" fill="#4e405e" font-family="Arial, sans-serif" font-size="32" text-anchor="start" font-weight="400">and Firefox. Switch and move tabs in the</text><text x="42" y="261" fill="#4e405e" font-family="Arial, sans-serif" font-size="32" text-anchor="start" font-weight="400">direction they appear.</text><rect x="22" y="372" width="816" height="330" rx="8" fill="#f1e9fa" stroke="#cbb5df"/><text x="42" y="412" fill="#62516e" font-family="Arial, sans-serif" font-size="22" text-anchor="start" font-weight="400">PROJECT / 02</text><text x="42" y="467" fill="#6f3ca3" font-family="Arial, sans-serif" font-size="42" text-anchor="start" font-weight="700">Let Him Grill</text><text x="42" y="527" fill="#4e405e" font-family="Arial, sans-serif" font-size="32" text-anchor="start" font-weight="400">A planning skill for Codex. Resolve</text><text x="42" y="571" fill="#4e405e" font-family="Arial, sans-serif" font-size="32" text-anchor="start" font-weight="400">reversible decisions and keep human</text><text x="42" y="615" fill="#4e405e" font-family="Arial, sans-serif" font-size="32" text-anchor="start" font-weight="400">judgment at meaningful gates.</text><rect x="22" y="726" width="816" height="330" rx="8" fill="#f1e9fa" stroke="#cbb5df"/><text x="42" y="766" fill="#62516e" font-family="Arial, sans-serif" font-size="22" text-anchor="start" font-weight="400">PROJECT / 03</text><text x="42" y="821" fill="#6f3ca3" font-family="Arial, sans-serif" font-size="42" text-anchor="start" font-weight="700">Penguin Patches</text><text x="42" y="881" fill="#4e405e" font-family="Arial, sans-serif" font-size="32" text-anchor="start" font-weight="400">Focused Fossify Android app fixes</text><text x="42" y="925" fill="#4e405e" font-family="Arial, sans-serif" font-size="32" text-anchor="start" font-weight="400">compatible with Morphe. Pre-release; see</text><text x="42" y="969" fill="#4e405e" font-family="Arial, sans-serif" font-size="32" text-anchor="start" font-weight="400">the repository for scope.</text></svg>