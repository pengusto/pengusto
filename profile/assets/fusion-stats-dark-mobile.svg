    @keyframes gs-stats-pengusto-dracula-dark-chip { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes gs-stats-pengusto-dracula-dark-cursor { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
