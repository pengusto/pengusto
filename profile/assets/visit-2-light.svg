<svg xmlns="http://www.w3.org/2000/svg" width="136" height="52" viewBox="0 0 136 52" role="img" aria-label="Project Kaplum Studio">
  <defs>
    <linearGradient id="gs-social-pengusto-pastel-light-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#faf7ff" />
      <stop offset="54%" stop-color="#fefcff" />
      <stop offset="100%" stop-color="#faf7ff" />
    </linearGradient>
    
    <radialGradient id="gs-social-pengusto-pastel-light-orb-0" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7545b7" stop-opacity="0.26" />
      <stop offset="58%" stop-color="#7545b7" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#7545b7" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="gs-social-pengusto-pastel-light-orb-1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d509d7" stop-opacity="0.2" />
      <stop offset="58%" stop-color="#d509d7" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#d509d7" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="gs-social-pengusto-pastel-light-orb-2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0980d7" stop-opacity="0.26" />
      <stop offset="58%" stop-color="#0980d7" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#0980d7" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="gs-social-pengusto-pastel-light-orb-3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d75f09" stop-opacity="0.2" />
      <stop offset="58%" stop-color="#d75f09" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#d75f09" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="gs-social-pengusto-pastel-light-orb-4" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4c1d95" stop-opacity="0.26" />
      <stop offset="58%" stop-color="#4c1d95" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#4c1d95" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="gs-social-pengusto-pastel-light-orb-5" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5813ce" stop-opacity="0.2" />
      <stop offset="58%" stop-color="#5813ce" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#5813ce" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="gs-social-pengusto-pastel-light-shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#30203f" stop-opacity="0.2" />
      <stop offset="44%" stop-color="#7545b7" stop-opacity="0.82" />
      <stop offset="100%" stop-color="#665575" stop-opacity="0.22" />
    </linearGradient>
    <linearGradient id="gs-social-pengusto-pastel-light-holo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#30203f" />
      <stop offset="18%" stop-color="#faf7ff" />
      <stop offset="38%" stop-color="#7545b7" />
      <stop offset="58%" stop-color="#665575" />
      <stop offset="78%" stop-color="#faf7ff" />
      <stop offset="100%" stop-color="#30203f" />
      <animateTransform attributeName="gradientTransform" type="rotate" from="0 0.5 0.5" to="360 0.5 0.5" dur="8s" repeatCount="indefinite" />
    </linearGradient>
  </defs>
  <style>
    #gs-social-pengusto-pastel-light .aura-orb-a { animation: gs-social-pengusto-pastel-light-float-a 9s ease-in-out infinite; }
    #gs-social-pengusto-pastel-light .aura-orb-b { animation: gs-social-pengusto-pastel-light-float-b 11s ease-in-out infinite 1.1s; }
    #gs-social-pengusto-pastel-light .aura-orb-c { animation: gs-social-pengusto-pastel-light-float-c 13s ease-in-out infinite 0.6s; }
    #gs-social-pengusto-pastel-light .aura-ring { animation: gs-social-pengusto-pastel-light-ring 8s ease-in-out infinite; }
    #gs-social-pengusto-pastel-light .aura-ring-b { animation: gs-social-pengusto-pastel-light-ring 10s ease-in-out infinite 1.6s; }
    #gs-social-pengusto-pastel-light .aura-chip { animation: gs-social-pengusto-pastel-light-chip 650ms ease-out both; }
    #gs-social-pengusto-pastel-light .aura-cursor { animation: gs-social-pengusto-pastel-light-cursor 1.1s step-end infinite; }
    #gs-social-pengusto-pastel-light .aura-bar { animation: gs-social-pengusto-pastel-light-bar 1.15s ease-out both; transform-box: fill-box; transform-origin: left; }
    #gs-social-pengusto-pastel-light .aura-cell { animation: gs-social-pengusto-pastel-light-cell 520ms ease-out both; }
    @keyframes gs-social-pengusto-pastel-light-cell { from { opacity: 0; transform: translateY(-3px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes gs-social-pengusto-pastel-light-float-a { 0%,100% { transform: translate(0,0); opacity: .58; } 50% { transform: translate(28px,-20px); opacity: .86; } }
    @keyframes gs-social-pengusto-pastel-light-float-b { 0%,100% { transform: translate(0,0); opacity: .42; } 50% { transform: translate(-24px,18px); opacity: .72; } }
    @keyframes gs-social-pengusto-pastel-light-float-c { 0%,100% { transform: translate(0,0) scale(1); opacity: .34; } 50% { transform: translate(18px,-12px) scale(1.18); opacity: .62; } }
    @keyframes gs-social-pengusto-pastel-light-ring { 0%,100% { opacity: .06; } 50% { opacity: .22; } }
    @keyframes gs-social-pengusto-pastel-light-chip { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes gs-social-pengusto-pastel-light-cursor { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
    @keyframes gs-social-pengusto-pastel-light-bar { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  </style>
  <g id="gs-social-pengusto-pastel-light">
    <g class="aura-chip" style="animation:none;opacity:1" transform="translate(-338,-37)">
      <rect x="341" y="40" width="130" height="46" rx="23" fill="#fefcff" stroke="url(#gs-social-pengusto-pastel-light-holo)" stroke-width="2" />
      <rect x="342" y="41" width="128" height="44" rx="22" fill="none" stroke="#fefcff" stroke-opacity="0.22" />
      <circle cx="356" cy="63" r="9" fill="#fefcff" fill-opacity="0.16" />
      <text x="356" y="68" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11" font-weight="900" fill="#fefcff" text-anchor="middle">↗</text>
      <text x="370" y="59" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="9" font-weight="850" letter-spacing=".7" fill="#665575">Project</text>
      <text x="370" y="75" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11" font-weight="800" fill="#30203f">Kaplum Studio</text>
    </g>
    
    </g>
</svg>