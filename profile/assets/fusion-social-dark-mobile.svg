    @keyframes gs-social-pengusto-dracula-dark-ring { 0%,100% { opacity: .06; } 50% { opacity: .22; } }
    @keyframes gs-social-pengusto-dracula-dark-chip { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
